name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# least privilege by default; the release job elevates itself
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn lint
      - run: yarn test
        env:
          CI: 'true'
      - run: yarn build

  # Release on every push to master (i.e. every merged PR):
  #   GitVersion computes the next version from tags + commits
  #   -> version injected into package.json -> npm publish (Trusted Publishing/OIDC)
  #   -> git tag vX.Y.Z -> GitHub release.
  # Tagging happens HERE, in the same job, on purpose: a tag pushed with
  # GITHUB_TOKEN never triggers another workflow run.
  # npm Trusted Publisher is registered for this file (ci.yml), no environment.
  # Every step is idempotent so a failed run can simply be re-run.
  release:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag, create GitHub release
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion needs full history and tags

      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Decide what this run has to do
        id: plan
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          tag_commit="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)"
          release=false
          tag_on_head=false
          if [ -n "$tag_commit" ]; then
            if [ "$tag_commit" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::HEAD is already tagged v$VERSION — only making sure the GitHub release exists"
              tag_on_head=true
            else
              echo "::notice::no fix:/feat:/breaking commits since v$VERSION — nothing to release"
            fi
          elif grep -qiE '[+=]semver:\s?(none|skip)' <<<"$(git log -1 --pretty=%B)"; then
            # escape hatch: a fix:/feat: commit that must NOT be released on its own
            # (HEAD = squash/merge commit, whose message contains the PR title);
            # GitVersion itself would still bump, so the token is honoured here.
            echo "::notice::'+semver: none' in the commit message — skipping release of $VERSION"
          else
            echo "::notice::next version: $VERSION"
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag_on_head=$tag_on_head" >> "$GITHUB_OUTPUT"

      - run: corepack enable
        if: steps.plan.outputs.release == 'true'
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.release == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        if: steps.plan.outputs.release == 'true'
        run: |
          if ! node -e "const [a,b,c]=process.versions.npm.split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)"; then
            npm install -g npm@11   # pinned major: npm@latest would move the engine floor under us
          fi
          npm --version
      - run: yarn install --immutable
        if: steps.plan.outputs.release == 'true'

      - name: Inject version into package.json
        if: steps.plan.outputs.release == 'true'
        working-directory: plugins/youtrack
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: npm pkg set version="$VERSION"

      - run: yarn tsc
        if: steps.plan.outputs.release == 'true'
      - run: yarn workspace @jmails/backstage-plugin-youtrack build
        if: steps.plan.outputs.release == 'true'
      # yarn pack runs backstage-cli prepack/postpack (dist entry points, config.schema.json)
      - run: yarn workspace @jmails/backstage-plugin-youtrack pack --out "$GITHUB_WORKSPACE/package.tgz"
        if: steps.plan.outputs.release == 'true'

      - name: Publish to npm
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if npm view "@jmails/backstage-plugin-youtrack@$VERSION" version >/dev/null 2>&1; then
            if [ "$RUN_ATTEMPT" -gt 1 ]; then
              # re-run of the same commit after publish succeeded but tagging failed
              echo "::warning::$VERSION was already published by a previous attempt of this run — tagging only"
            else
              echo "::error::$VERSION is already on npm but v$VERSION is not tagged. Re-run the workflow run that published it (so ITS commit gets the tag) instead of merging more commits."
              exit 1
            fi
          else
            # --provenance is explicit: the docs promise it is automatic, in practice it is not always.
            npm publish "$GITHUB_WORKSPACE/package.tgz" --access public --provenance
          fi

      - name: Tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: GitHub release
        if: steps.plan.outputs.release == 'true' || steps.plan.outputs.tag_on_head == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists"
            exit 0
          fi
          assets=()
          if [ -f "$GITHUB_WORKSPACE/package.tgz" ]; then
            assets+=("$GITHUB_WORKSPACE/package.tgz#npm tarball")
          fi
          gh release create "v$VERSION" "${assets[@]}" --title "v$VERSION" --generate-notes
