name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn lint
      - run: yarn test
        env:
          CI: 'true'
      - run: yarn build

  # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
  # One-time setup on npmjs.com: package → Settings → Trusted Publisher →
  # GitHub Actions: user/org "jmail", repository "backstage-plugin-youtrack",
  # workflow filename "ci.yml". The first version must be published manually
  # (npm does not allow configuring a trusted publisher before the package exists).
  publish:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          registry-url: https://registry.npmjs.org
      # OIDC publishing requires npm >= 11.5.1 — upgrade to be safe regardless of the bundled version
      - run: npm install -g npm@latest
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn workspace @jmails/backstage-plugin-youtrack build
      # yarn pack runs backstage-cli prepack/postpack (dist entry points, config.schema.json)
      - run: yarn workspace @jmails/backstage-plugin-youtrack pack --out "${{ github.workspace }}/package.tgz"
      - run: npm publish "${{ github.workspace }}/package.tgz" --access public
